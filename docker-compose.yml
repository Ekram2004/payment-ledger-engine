
services:
  postgres:
    image: postgres:16-alpine
    container_name: ledger_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_user -d payment_ledger_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
